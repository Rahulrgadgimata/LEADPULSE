# Render Blueprint — https://render.com/docs/blueprint-spec
#
# One Docker web service running the Node API, the static frontend it serves,
# and the Python Scrapling sidecar in the same container (they talk over
# 127.0.0.1, so they must share a network namespace).
#
# Secrets are marked `sync: false`: Render prompts for them on first apply and
# keeps them in the dashboard, so no key is ever committed here.

services:
  - type: web
    name: leadpulse-ai
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api
    autoDeploy: true

    # ── Persistent storage ──────────────────────────────────────────────────
    # No disk is needed: application data lives in Supabase Postgres
    # (DATABASE_URL below). The container is disposable by design, which is
    # what the free plan requires — it is wiped on every deploy, restart and
    # spin-down, and that now costs only the run that was in flight.

    envVars:
      # ── Server ───────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      # PORT is deliberately absent: Render injects its own (10000) and routes
      # to whatever the service binds. Setting it here makes the two disagree.
      # Render terminates TLS at its edge, so the client IP arrives in
      # X-Forwarded-For. Without this every request rate-limits as one caller.
      - key: TRUST_PROXY
        value: "true"
      # Supabase Postgres. The instance keeps no state of its own now, which is
      # what makes the free plan viable: a restart, deploy or spin-down costs
      # the run in flight, not the data.
      - key: DATABASE_URL
        sync: false
      # The free instance is capped at 512Mi, shared with the Python Scrapling
      # sidecar, and the container has been killed mid-discovery repeatedly.
      # Hold V8's heap well under the cgroup limit so it collects garbage
      # instead of growing until the kernel steps in — a kill also wipes the
      # diskless database. This is the safety net; the volume and concurrency
      # settings further down are the actual fix.
      - key: NODE_OPTIONS
        value: --max-old-space-size=256
      # Empty = same-origin only, which is right because this service also
      # serves the UI.
      - key: CORS_ORIGIN
        value: ""

      # ── Security ─────────────────────────────────────────────────────────
      # generateValue makes Render mint a random secret on first deploy.
      # Replace it with the existing value if current sessions must survive.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

      # ── Rate limits (per IP per minute) ──────────────────────────────────
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: DISCOVERY_RATE_LIMIT_PER_MINUTE
        value: "3"
      - key: COPILOT_RATE_LIMIT_PER_MINUTE
        value: "15"

      # ── AI providers ─────────────────────────────────────────────────────
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_FALLBACK
        sync: false
      - key: GROQ_CHAT_API_KEY
        sync: false
      - key: GROQ_MODEL_EXTRACTION
        value: qwen/qwen3.6-27b
      # Qwen for chat too. Groq's openai/gpt-oss-* now reject
      # reasoning_effort="none" (low/medium/high only), so every call paid a
      # rejected round-trip and then burned its output budget on reasoning —
      # returning empty content on the shorter prompts.
      - key: GROQ_MODEL_CHAT
        value: qwen/qwen3.6-27b
      - key: GROQ_EXTRACTION_REASONING
        value: none
      # Measured from the API's own headers: 8000 tokens/min and 1000
      # requests/day per key on the free tier. The previous 11000 was above the
      # real ceiling, so the pacer approved calls the API then rejected.
      - key: GROQ_TPM_LIMIT
        value: "8000"
      - key: GROQ_RPM_LIMIT
        value: "28"
      - key: GROQ_RPD_LIMIT
        value: "1000"
      - key: GROQ_BATCH_SIZE
        value: "12"
      - key: GROQ_CONCURRENCY
        value: "1"
      - key: MISTRAL_API_KEY
        sync: false

      # ── Enrichment & signals ─────────────────────────────────────────────
      - key: HUNTER_API_KEY
        sync: false
      - key: APOLLO_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: TWITTER_BEARER_TOKEN
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDDIT_USER_AGENT
        value: "nodejs:leadpulse-ai:1.0 (by /u/leadpulse)"

      # ── Scrapling sidecar (same container) ───────────────────────────────
      - key: SCRAPLING_ENABLED
        value: "true"
      - key: SCRAPLING_HOST
        value: 127.0.0.1
      - key: SCRAPLING_PORT
        value: "3765"
      # `fetcher` is curl_cffi TLS impersonation — no browser process, which
      # matters on a 512MB free instance where Chromium would be OOM-killed.
      - key: SCRAPLING_DEFAULT_MODE
        value: fetcher
      - key: SCRAPLING_PYTHON
        value: python3
      - key: SCRAPLING_CONCURRENCY
        value: "2"
      # Scrapling escalates a failed fetch to a Playwright browser. That is the
      # same memory problem as SCRAPER_BROWSER_ENABLED, one process over — and
      # the launch outlasts the caller's timeout, so every blocked query cost
      # 90s and returned nothing. Off here; TLS impersonation still runs.
      - key: SCRAPLING_STEALTH_ENABLED
        value: "false"

      # ── Discovery volume & pacing ────────────────────────────────────────
      # A run is bounded by the clock, not by lead counts: collectors check the
      # deadline between queries and stop early. That is what allows every
      # source to be scraped properly here without a run growing unbounded.
      #
      # Memory, not time, is the binding constraint on this instance type. Runs
      # at 30 and then 15 leads both ended with the container restarting
      # mid-run, and with no disk each restart wiped the database — so
      # everything here is sized for survival rather than throughput. Raise it
      # only alongside the `disk:` block and a paid plan.
      - key: DISCOVERY_RUN_BUDGET_MS
        value: "600000"
      - key: DISCOVERY_COLLECT_BUDGET_RATIO
        value: "0.6"
      # One run at a time, with a 5-minute cooldown before the next queued run
      # starts, so back-to-back runs stop throttling each other.
      - key: DISCOVERY_COOLDOWN_MS
        value: "300000"
      - key: DISCOVERY_QUEUE_LIMIT
        value: "5"
      - key: DISCOVERY_TARGET_LEADS
        value: "10"
      - key: DISCOVERY_MAX_QUERIES
        value: "6"
      - key: DISCOVERY_STALE_JOB_MINUTES
        value: "12"
      # Serial. Peak memory is set by how many scraped pages are held at once,
      # and concurrency is the direct multiplier on that — the one lever that
      # cuts the peak without giving up a source. Runs take longer instead,
      # which the ten-minute budget already allows for.
      - key: SCRAPER_CONCURRENCY
        value: "1"
      - key: SCRAPER_PAGE_TIMEOUT_MS
        value: "8000"
      - key: ENRICHMENT_CONCURRENCY
        value: "1"
      # News held every article in memory before batching them through the
      # model, which made it the largest single allocation in a run.
      - key: NEWS_MAX_ARTICLES
        value: "60"
      - key: NEWS_MAX_QUERIES
        value: "6"
      - key: NEWS_CONCURRENCY
        value: "2"
      - key: LINKEDIN_TARGET_LEADS
        value: "5"
      - key: LINKEDIN_MAX_QUERIES
        value: "3"
      - key: BUYER_TARGET_LEADS
        value: "5"
      - key: BUYER_MAX_QUERIES
        value: "3"
      - key: DISCOVERY_DIRECTORY_PAGES
        value: "2"
      - key: DISCOVERY_DIRECTORY_LINKS
        value: "10"
      # A freshly saved ICP is protected from deletion for an hour and wins the
      # active-target fallback. The browser also keeps a copy and restores it if
      # this instance loses the database, which a free instance does on every
      # restart and spin-down.
      - key: ICP_PROTECTION_MINUTES
        value: "60"

      # ── Firecrawl (github.com/firecrawl/firecrawl) ───────────────────────
      # Optional, and the only measured way to get Google results from this
      # host: keyless Google answers /sorry from a datacenter IP, and twelve
      # public SearXNG instances all rate-limited or had their JSON API off.
      # Also renders JS-only and Cloudflare-fronted pages on Firecrawl's
      # machines rather than in this 512Mi container. Set the key in the
      # dashboard to enable; without it nothing changes.
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: FIRECRAWL_SCRAPE_FALLBACK
        value: "true"

      # ── SearchAPI.io — Google web + Google Maps ──────────────────────────
      # Maps is why this is here: operating local businesses with a street
      # address, a phone number and a website, inside the requested city. It is
      # the only source in the pipeline that reliably carries a phone number,
      # and the only one whose results are geo-correct by construction.
      # Credits are few, so per-run spending is capped and the keyless sources
      # still do the bulk of the work.
      - key: SEARCHAPI_KEY
        sync: false
      - key: SEARCHAPI_MAX_QUERIES_PER_RUN
        value: "6"
      - key: MAPS_MAX_QUERIES
        value: "4"
      - key: MAPS_MAX_CITIES
        value: "3"

      # ── Spreadsheet import ───────────────────────────────────────────────
      # Uploading a company list enriches every row, so it is capped like a
      # discovery run to keep the instance inside its memory budget.
      - key: IMPORT_MAX_ROWS
        value: "150"
      - key: IMPORT_MAX_FILE_MB
        value: "5"

      # ── Search sources ───────────────────────────────────────────────────
      - key: SEARCH_ENABLE_GOOGLE
        value: "false"
      - key: SEARCH_SOURCE_COOLDOWN_AFTER
        value: "3"
      - key: SEARCH_SOURCE_COOLDOWN_MS
        value: "240000"
      - key: SCRAPER_DELAY_MS
        value: "2000"
      # No headless Chromium on a 512Mi instance — three collectors each keep
      # their own browser, and that is what triggered the OOM kills. Scrapling's
      # TLS-impersonation fetcher and the plain-HTTP paths carry search instead.
      # Turn this back on if the service moves to an instance with real memory.
      - key: SCRAPER_BROWSER_ENABLED
        value: "false"
      - key: SERPER_API_KEY
        sync: false
      - key: BRAVE_API_KEY
        sync: false

      # ── Scheduler ────────────────────────────────────────────────────────
      - key: CRON_SCHEDULE
        value: "0 2 * * *"

      # ── Phase 2: outreach ────────────────────────────────────────────────
      - key: OUTREACH_AI_PROVIDER
        value: auto
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        value: lead Pulse AI
      - key: MAIL_REPLY_TO
        sync: false
      - key: OUTREACH_DRY_RUN
        value: "false"
      - key: OUTREACH_DAILY_SEND_LIMIT
        value: "200"
      - key: OUTREACH_BULK_SEND_LIMIT
        value: "50"
      - key: OUTREACH_SCHEDULER_ENABLED
        value: "true"
      - key: OUTREACH_SCHEDULER_INTERVAL_MS
        value: "30000"
      # Unsubscribe links must resolve for the recipient, so this has to be the
      # public origin (https://leadpulse-ai.onrender.com). Left unsynced because
      # a service cannot read its own RENDER_EXTERNAL_URL through fromService;
      # `node scripts/render-sync-env.js` reads it off the API and fills it in.
      - key: APP_BASE_URL
        sync: false
